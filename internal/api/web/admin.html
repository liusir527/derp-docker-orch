<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DERP 管理面板</title>
<style>
  :root {
    --bg: #0e1116; --surface: #161b24; --surface-2: #1d2430;
    --text: #e6eaf0; --muted: #8b94a3; --accent: #4cc9a0;
    --danger: #f4706f; --warn: #f0b75e; --border: #2a3342;
    --mono: "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 2rem 1rem; max-width: 1024px; margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  header h1 { font-size: 1.5rem; letter-spacing: -0.02em; }
  header p { color: var(--muted); margin-top: .2rem; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.4rem; margin-top: 1.4rem;
  }
  .card h2 { font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 1rem; }

  input, select, button { font: inherit; }
  input, select {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: .55rem .7rem;
    width: 100%;
  }
  button {
    border: 0; border-radius: 8px; padding: .55rem 1.1rem; cursor: pointer;
    background: var(--accent); color: #08120e; font-weight: 600;
  }
  button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); color: #1a0505; }

  .msg { font-size: .85rem; margin-top: .5rem; min-height: 1.2em; }
  .msg.err { color: var(--danger); }

  /* 表单布局:标签在上,输入在下,纵向堆叠不重叠 */
  .field { display: flex; flex-direction: column; gap: .35rem; }
  .field label { font-size: .8rem; color: var(--muted); }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: .9rem;
  }
  .form-actions { margin-top: 1rem; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .8rem; }
  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: .8rem 1rem; }
  .stat .n { font-size: 1.4rem; font-weight: 700; font-family: var(--mono); word-break: break-all; }
  .stat .l { font-size: .75rem; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--border); font-size: .85rem; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.mono { font-family: var(--mono); font-size: .82rem; word-break: break-all; }

  .pill { display: inline-block; font-size: .72rem; padding: .1rem .5rem; border-radius: 99px; white-space: nowrap; }
  .pill.unused { background: #123528; color: var(--accent); }
  .pill.used { background: #3a3434; color: var(--muted); }
  .pill.up { background: #123528; color: var(--accent); }
  .pill.down { background: #3a1c1c; color: var(--danger); }

  .warnbar { background: #33280f; border: 1px solid #6b5520; color: var(--warn); border-radius: 8px; padding: .6rem .9rem; margin-top: .8rem; font-size: .85rem; }

  /* 登录卡片:窄居中,纵向 */
  .login-wrap { max-width: 420px; margin: 2.5rem auto 0; }
  .captcha-row { display: flex; gap: .9rem; align-items: flex-end; }
  .captcha-row .field { flex: 1; }
  #captcha-img {
    border: 1px solid var(--border); border-radius: 8px; height: 44px; cursor: pointer;
    display: block; max-width: 140px;
  }

  .hidden { display: none; }

  /* 模态框:遮罩 + 居中卡片,复用 :root 变量,无新依赖。 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(8, 12, 18, .72);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 4rem 1rem 1rem; z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.2rem 1.3rem; max-width: 640px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .modal h3 { font-size: 1.05rem; margin-bottom: .8rem; word-break: break-all; }
  .modal .body { margin-bottom: 1rem; }
  .modal .actions { display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; }
  .modal pre {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: .8rem; max-height: 320px; overflow: auto;
    font-family: var(--mono); font-size: .8rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  .modal .confirm-target {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: .15rem .45rem; font-family: var(--mono);
  }
  .modal .msg { margin-top: .5rem; }
  .row-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
  .row-actions button { padding: .35rem .7rem; font-size: .8rem; }

  @media (max-width: 640px) {
    body { padding: 1rem .75rem; }
    .form-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .captcha-row { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>DERP 管理面板</h1>
    <p>兑换码管理 · 资源监控 · 审计日志</p>
  </div>
  <button class="secondary hidden" id="btn-logout">退出</button>
</header>

<!-- 登录 -->
<div class="card login-wrap hidden" id="login-card">
  <h2>管理员登录</h2>
  <div class="field">
    <label for="u">用户名</label>
    <input id="u" value="admin" autocomplete="username">
  </div>
  <div class="field" style="margin-top:.9rem">
    <label for="p">密码</label>
    <input type="password" id="p" autocomplete="current-password">
  </div>
  <div id="captcha-fields" class="hidden" style="margin-top:.9rem">
    <div class="captcha-row">
      <div class="field">
        <label for="c">验证码</label>
        <input id="c" autocomplete="off" placeholder="输入图中字符">
      </div>
      <div class="field">
        <label>点击刷新</label>
        <img id="captcha-img" alt="验证码">
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button id="btn-login">登录</button>
  </div>
  <p class="msg err" id="login-msg"></p>
</div>

<!-- 主面板 -->
<div id="panel" class="hidden">
  <!-- 统计 -->
  <div class="card">
    <h2>平台概览</h2>
    <div class="stats" id="stats-grid"></div>
    <div id="warnbar" class="warnbar hidden"></div>
  </div>

  <!-- 建码 -->
  <div class="card">
    <h2>批量创建兑换码</h2>
    <div class="form-grid">
      <div class="field"><label for="count">数量</label><input type="number" id="count" value="10" min="1" max="1000"></div>
      <div class="field"><label for="dv">时长</label><input type="number" id="dv" value="30" min="1"></div>
      <div class="field">
        <label for="du">单位</label>
        <select id="du">
          <option value="day">天</option>
          <option value="month">月</option>
          <option value="year">年</option>
        </select>
      </div>
      <div class="field"><label for="prefix">前缀(可选)</label><input id="prefix" placeholder="默认 DERP,≤8 位"></div>
      <div class="field"><label for="note">备注(可选)</label><input id="note"></div>
    </div>
    <div class="form-actions">
      <button id="btn-create">生成兑换码</button>
    </div>
    <p class="msg" id="create-msg"></p>
  </div>

  <!-- 码列表 -->
  <div class="card">
    <h2>兑换码列表</h2>
    <div style="display:flex; gap:.8rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:.6rem">
      <div class="field" style="width:170px">
        <label for="filter">状态</label>
        <select id="filter">
          <option value="all">全部</option>
          <option value="unused" selected>未使用</option>
          <option value="used">已使用</option>
        </select>
      </div>
      <button class="secondary" id="btn-export-txt">导出 .txt</button>
      <button class="secondary" id="btn-export-csv">导出 .csv</button>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>兑换码</th><th>时长</th><th>状态</th><th>使用实例</th><th>创建时间</th></tr></thead>
      <tbody id="codes-body"></tbody>
    </table>
    </div>
  </div>

  <!-- 实例 -->
  <div class="card">
    <h2>运行实例与资源</h2>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>实例</th><th>子域名</th><th>状态</th><th>CPU%</th><th>内存</th><th>过期时间</th><th>操作</th></tr></thead>
      <tbody id="inst-body"></tbody>
    </table>
    </div>
  </div>

  <!-- 审计 -->
  <div class="card">
    <h2>审计日志</h2>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>时间</th><th>类型</th><th>兑换码</th><th>实例</th><th>详情</th></tr></thead>
      <tbody id="audit-body"></tbody>
    </table>
    </div>
  </div>

  <!-- 改密码 -->
  <div class="card">
    <h2>修改密码</h2>
    <div class="form-grid" style="max-width:560px">
      <div class="field"><label for="old-p">旧密码</label><input type="password" id="old-p" autocomplete="current-password"></div>
      <div class="field"><label for="new-p">新密码(≥6 位)</label><input type="password" id="new-p" autocomplete="new-password"></div>
      <div class="field"><label for="new-p2">确认新密码</label><input type="password" id="new-p2" autocomplete="new-password"></div>
    </div>
    <div class="form-actions">
      <button id="btn-chpw" class="secondary">修改密码</button>
    </div>
    <p class="msg" id="chpw-msg"></p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let captchaId = null;

  const api = (path, opts = {}) =>
    fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    }).then(async res => {
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) { showLogin(); throw new Error('会话已过期,请重新登录'); }
      if (!res.ok || body.ok === false) throw new Error(body.error || ('HTTP ' + res.status));
      return body.data;
    });

  const loadCaptcha = () =>
    fetch('/captcha')
      .then(r => {
        const id = r.headers.get('X-Captcha-Id');
        if (id) captchaId = id;
        return r.blob();
      })
      .then(b => { $('captcha-img').src = URL.createObjectURL(b); })
      .catch(() => {});

  // 刷新登录状态:决定是否显示验证码。
  const refreshLoginUI = () => {
    fetch('/v1/admin/login/state')
      .then(r => r.json())
      .then(b => {
        const need = !!(b.data && b.data.needCaptcha);
        $('captcha-fields').classList.toggle('hidden', !need);
        if (need) loadCaptcha();
      })
      .catch(() => {});
  };

  const showLogin = () => {
    $('login-card').classList.remove('hidden');
    $('panel').classList.add('hidden');
    $('btn-logout').classList.add('hidden');
    refreshLoginUI();
  };

  const showPanel = () => {
    $('login-card').classList.add('hidden');
    $('panel').classList.remove('hidden');
    $('btn-logout').classList.remove('hidden');
    refresh();
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  $('btn-login').onclick = async () => {
    $('login-msg').textContent = '';
    const payload = { username: $('u').value.trim(), password: $('p').value };
    if (!$('captcha-fields').classList.contains('hidden')) {
      payload.captchaId = captchaId;
      payload.captchaText = $('c').value.trim();
    }
    try {
      await api('/v1/admin/login', { method: 'POST', body: JSON.stringify(payload) });
      showPanel();
    } catch (e) {
      $('login-msg').textContent = e.message;
      // 密码错 → 后端标记,刷新需验证码。
      refreshLoginUI();
    }
  };

  $('btn-logout').onclick = async () => {
    try { await api('/v1/admin/logout', { method: 'POST' }); } catch (e) {}
    showLogin();
  };

  $('btn-chpw').onclick = async () => {
    $('chpw-msg').textContent = '';
    const np = $('new-p').value, np2 = $('new-p2').value;
    if (np !== np2) { $('chpw-msg').className = 'msg err'; $('chpw-msg').textContent = '两次新密码不一致'; return; }
    try {
      const d = await api('/v1/admin/password', {
        method: 'POST',
        body: JSON.stringify({ oldPassword: $('old-p').value, newPassword: np }),
      });
      $('chpw-msg').textContent = d.relogin ? '密码已修改,请用新密码重新登录' : '密码已修改';
      ['old-p','new-p','new-p2'].forEach(id => $(id).value = '');
      if (d.relogin) showLogin();
    } catch (e) {
      $('chpw-msg').className = 'msg err';
      $('chpw-msg').textContent = e.message;
    }
  };

  $('btn-create').onclick = async () => {
    $('create-msg').textContent = '';
    try {
      const d = await api('/v1/admin/codes', {
        method: 'POST',
        body: JSON.stringify({
          count: parseInt($('count').value, 10),
          durationValue: parseInt($('dv').value, 10),
          durationUnit: $('du').value,
          prefix: $('prefix').value.trim(),
          note: $('note').value.trim(),
        }),
      });
      $('create-msg').textContent = `已生成 ${d.created} 个兑换码`;
      loadCodes(); loadStats();
    } catch (e) {
      $('create-msg').className = 'msg err';
      $('create-msg').textContent = e.message;
    }
  };

  const loadCodes = () => {
    const status = $('filter').value;
    return api('/v1/admin/codes?status=' + status + '&limit=100')
      .then(d => {
        const tb = $('codes-body');
        tb.textContent = '';
        for (const c of d.codes) {
          const tr = document.createElement('tr');
          const used = c.usedByInstanceId ? 'used' : 'unused';
          tr.innerHTML =
            '<td class="mono">' + esc(c.code) + '</td>' +
            '<td>' + esc(c.durationValue + ' ' + c.durationUnit) + '</td>' +
            '<td><span class="pill ' + used + '">' + (used === 'used' ? '已使用' : '未使用') + '</span></td>' +
            '<td class="mono">' + esc(c.usedByInstanceId || '–') + '</td>' +
            '<td class="mono">' + esc((c.createdAt || '').replace('T', ' ').slice(0, 16)) + '</td>';
          tb.appendChild(tr);
        }
      });
  };

  const loadStats = () => {
    return api('/v1/admin/stats').then(d => {
      const r = d.resources || {};
      const mb = b => (b / 1024 / 1024).toFixed(1) + ' MB';
      const items = [
        ['容器总数', d.activeInstances + ' / ' + r.maxContainers],
        ['兑换码', d.codes.unused + ' 未用 · ' + d.codes.used + ' 已用'],
        ['宿主内存', r.memTotalBytes ? mb(r.memUsedBytes) + ' / ' + mb(r.memTotalBytes) : 'N/A'],
        ['内存使用率', (r.memPct || 0).toFixed(1) + '%'],
        ['容器 CPU', (r.cpuUsedPct || 0).toFixed(1) + '%'],
      ];
      const grid = $('stats-grid');
      grid.textContent = '';
      for (const [l, n] of items) {
        const div = document.createElement('div');
        div.className = 'stat';
        div.innerHTML = '<div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div>';
        grid.appendChild(div);
      }
      const wb = $('warnbar');
      if ((r.memPct || 0) > 75 || (r.cpuUsedPct || 0) > 75 || d.activeInstances >= r.maxContainers) {
        wb.classList.remove('hidden');
        wb.textContent = '警告: 资源水位偏高或容器数接近上限,新兑换将被拒绝以保护系统。';
      } else {
        wb.classList.add('hidden');
      }
    });
  };

  const loadInstances = () => {
    return api('/v1/admin/instances').then(d => {
      const tb = $('inst-body');
      tb.textContent = '';
      for (const i of d.instances) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="mono">' + esc(i.name) + '</td>' +
          '<td class="mono">' + esc(i.subdomain) + '</td>' +
          '<td><span class="pill ' + (i.containerState === 'running' ? 'up' : 'down') + '">' + esc(i.containerState) + '</span></td>' +
          '<td>' + (i.cpuPct || 0).toFixed(1) + '</td>' +
          '<td class="mono">' + ((i.memBytes || 0) / 1024 / 1024).toFixed(1) + ' MB</td>' +
          '<td class="mono">' + esc((i.expiresAt || '').replace('T', ' ').slice(0, 16)) + '</td>' +
          '<td><div class="row-actions">' +
            '<button class="secondary" data-action="derpmap" data-id="' + esc(i.id) + '" data-name="' + esc(i.name) + '">查看 derpMap</button>' +
            '<button class="danger" data-action="delete" data-id="' + esc(i.id) + '" data-name="' + esc(i.name) + '">删除</button>' +
          '</div></td>';
        tb.appendChild(tr);
      }
    });
  };

  const loadAudit = () => {
    return api('/v1/admin/audit?limit=100').then(d => {
      const tb = $('audit-body');
      tb.textContent = '';
      for (const l of d.logs) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="mono">' + esc(l.createdAt) + '</td>' +
          '<td>' + esc(l.kind) + '</td>' +
          '<td class="mono">' + esc(l.code || '–') + '</td>' +
          '<td class="mono">' + esc(l.instanceId || '–') + '</td>' +
          '<td>' + esc(l.detail || '') + '</td>';
        tb.appendChild(tr);
      }
    });
  };

  const refresh = () => {
    loadCodes().catch(() => {}); loadStats().catch(() => {}); loadInstances().catch(() => {}); loadAudit().catch(() => {});
  };

  // ===== 实例行操作:derpMap 模态框 + 删除二次确认 =====

  // 模态框 shell 一次性创建。
  let modalMask = null;
  const ensureModalShell = () => {
    if (modalMask) return modalMask;
    modalMask = document.createElement('div');
    modalMask.className = 'modal-mask hidden';
    modalMask.addEventListener('click', e => { if (e.target === modalMask) closeModal(); });
    document.body.appendChild(modalMask);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    return modalMask;
  };
  const openModal = (title, bodyEl, actionEls) => {
    const m = ensureModalShell();
    m.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'modal';
    const h = document.createElement('h3');
    h.textContent = title;
    card.appendChild(h);
    const body = document.createElement('div');
    body.className = 'body';
    body.appendChild(bodyEl);
    card.appendChild(body);
    if (actionEls && actionEls.length) {
      const acts = document.createElement('div');
      acts.className = 'actions';
      for (const a of actionEls) acts.appendChild(a);
      card.appendChild(acts);
    }
    m.appendChild(card);
    m.classList.remove('hidden');
  };
  const closeModal = () => { if (modalMask) modalMask.classList.add('hidden'); };

  // 复制降级方案。
  const copyToClipboard = text => {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('execCommand 失败'));
      } catch (e) {
        document.body.removeChild(ta);
        reject(e);
      }
    });
  };

  // derpMap 模态框:fetch → <pre> + 复制/下载/关闭。
  const openDerpMapModal = (id, name) => {
    const body = document.createElement('div');
    body.textContent = '加载中…';
    const btnClose = mkBtn('关闭', 'secondary', closeModal);
    const btnCopy = mkBtn('复制', 'secondary', null, true);
    const btnDl = mkBtn('下载 .json', 'secondary', null, true);
    btnCopy.disabled = true; btnDl.disabled = true;
    openModal('derpMap · ' + name, body, [btnClose, btnDl, btnCopy]);

    fetch('/v1/admin/instances/' + encodeURIComponent(id) + '/derpmap')
      .then(async r => {
        const b = await r.json().catch(() => ({}));
        if (r.status === 401) { showLogin(); throw new Error('会话已过期'); }
        if (!r.ok || b.ok === false) throw new Error(b.error || ('HTTP ' + r.status));
        return b.data.derpMap;
      })
      .then(raw => {
        const text = typeof raw === 'string' ? raw : JSON.stringify(raw, null, 2);
        body.textContent = '';
        const pre = document.createElement('pre');
        pre.textContent = text;
        body.appendChild(pre);
        btnCopy.disabled = false;
        btnCopy.onclick = () => copyToClipboard(text)
          .then(() => { btnCopy.textContent = '已复制'; setTimeout(() => { btnCopy.textContent = '复制'; }, 1500); })
          .catch(e => alert('复制失败:' + e.message));
        btnDl.disabled = false;
        btnDl.onclick = () => {
          const blob = new Blob([text], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'derpmap-' + name + '.json';
          document.body.appendChild(a); a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
        };
      })
      .catch(e => {
        body.textContent = '';
        const err = document.createElement('div');
        err.className = 'msg err';
        err.textContent = '加载失败:' + e.message;
        body.appendChild(err);
      });
  };

  // 二次确认模态框:输入框 == 实例名 时确认按钮 enabled。
  const confirmDeleteModal = (id, name) => {
    const body = document.createElement('div');
    const intro = document.createElement('p');
    intro.innerHTML = '将永久删除实例 <code class="confirm-target">' + esc(name) + '</code>(停止容器并释放资源)。请输入实例名以确认:';
    body.appendChild(intro);
    const input = document.createElement('input');
    input.id = 'confirm-input';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.placeholder = name;
    body.appendChild(input);
    const msg = document.createElement('p');
    msg.className = 'msg err';
    msg.style.minHeight = '1.2em';
    body.appendChild(msg);

    const btnCancel = mkBtn('取消', 'secondary', closeModal);
    const btnOk = mkBtn('确认删除', 'danger', null);
    btnOk.disabled = true;
    input.oninput = () => {
      const ok = input.value.trim() === name;
      btnOk.disabled = !ok;
      msg.textContent = ok ? '' : '实例名不匹配';
    };
    btnOk.onclick = () => { if (!btnOk.disabled) doDelete(id, btnOk); };

    openModal('删除实例', body, [btnCancel, btnOk]);
    setTimeout(() => input.focus(), 0);
  };

  const doDelete = (id, btn) => {
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = '删除中…';
    fetch('/v1/admin/instances/' + encodeURIComponent(id), { method: 'DELETE' })
      .then(async r => {
        const b = await r.json().catch(() => ({}));
        if (r.status === 401) { showLogin(); throw new Error('会话已过期'); }
        if (!r.ok || b.ok === false) throw new Error(b.error || ('HTTP ' + r.status));
        return b.data;
      })
      .then(() => { closeModal(); refresh(); })
      .catch(e => {
        btn.textContent = orig;
        btn.disabled = false;
        const m = document.querySelector('.modal .msg.err');
        if (m) m.textContent = '删除失败:' + e.message;
      });
  };

  // 工厂:避免重复 createElement('button') 代码。
  const mkBtn = (text, cls, onClick, disabled) => {
    const b = document.createElement('button');
    b.textContent = text;
    if (cls) b.className = cls;
    if (disabled) b.disabled = true;
    if (onClick) b.onclick = onClick;
    return b;
  };

  // 事件委托:实例行操作列的按钮。
  $('inst-body').addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    const name = btn.dataset.name;
    if (action === 'derpmap') openDerpMapModal(id, name);
    else if (action === 'delete') confirmDeleteModal(id, name);
  });

  const exportCodes = format => {
    const status = $('filter').value;
    window.open('/v1/admin/codes/export?status=' + status + '&format=' + format, '_blank');
  };
  $('btn-export-txt').onclick = () => exportCodes('txt');
  $('btn-export-csv').onclick = () => exportCodes('csv');
  $('filter').onchange = loadCodes;
  $('captcha-img').onclick = loadCaptcha;

  // 启动:已有会话直接进面板,否则显示登录。
  api('/v1/admin/stats').then(showPanel).catch(showLogin);
})();
</script>
</body>
</html>
