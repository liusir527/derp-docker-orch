# DERP 容器 SaaS 平台部署(兑换码 + 双面板)。
# 用法:
#   export RELAY_BASE_DOMAIN=wh.easylan.site
#   export ADMIN_API_KEY="$(openssl rand -hex 32)"        # 旧 Bearer 管理密钥(脚本/内部)
#   export ADMIN_PASSWORD="$(openssl rand -base64 18)"    # 管理面板登录密码(必填)
#   docker compose -f deploy/docker-compose.yml up -d
# 入口:
#   http://<host>:8080/redeem   用户兑换面板(输入兑换码 → 创建 DERP 容器 → derpMap)
#   http://<host>:8080/admin    管理面板(admin + 密码 + 验证码 → 建码/导出/统计/审计)
# 前置:
#   1. 宝塔面板已签发 *.relay.<base> 证书到 ${CERTS_DIR:-/etc/derp-certs}
#   2. BT-nginx 已配站点 server_name *.relay.<base> → 127.0.0.1:1443
#   3. BT 防火墙放行 ${DERP_PORT:-1443}
services:
  nginx-proxy:
    image: jwilder/nginx-proxy:1.11.6
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:1443:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks: [orch-net]

  platformd:
    build:
      context: ..
      dockerfile: Dockerfile
    image: derp-orch:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orch-data:/data
      - ${CERTS_DIR:-/etc/derp-certs}:/etc/derp-certs:rw
    environment:
      RELAY_BASE_DOMAIN: ${RELAY_BASE_DOMAIN:?RELAY_BASE_DOMAIN 必填}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY 必填}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 必填}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      MAX_CONTAINERS: ${MAX_CONTAINERS:-100}
      MEMORY_WATERMARK_PERCENT: ${MEMORY_WATERMARK_PERCENT:-80}
      CPU_WATERMARK_PERCENT: ${CPU_WATERMARK_PERCENT:-80}
      CAPTCHA_TTL_SECONDS: ${CAPTCHA_TTL_SECONDS:-300}
      REDEEM_IP_RATE_LIMIT: ${REDEEM_IP_RATE_LIMIT:-5}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-10}
      LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      DEFAULT_TTL_HOURS: ${DEFAULT_TTL_HOURS:-24}
      REGION_ID_BASE: ${REGION_ID_BASE:-900}
      STUN_PORT_BASE: ${STUN_PORT_BASE:-3478}
      DERP_PORT: ${DERP_PORT:-443}
      DOCKER_HOST: unix:///var/run/docker.sock
      CERTS_DIR: /etc/derp-certs
      DOCKER_NETWORK: orch-net
      VERIFY_BASE_URL: http://platformd:8080
      DB_PATH: /data/derp-orch.db
      CERT_DNS_PROVIDER: ${CERT_DNS_PROVIDER:-dnspod}
      CERT_DNSPOD_API_ID: ${CERT_DNSPOD_API_ID:-}
      CERT_DNSPOD_API_TOKEN: ${CERT_DNSPOD_API_TOKEN:-}
      CERT_EMAIL: ${CERT_EMAIL:-admin@${RELAY_BASE_DOMAIN}}
      CERT_RENEW_BEFORE_DAYS: ${CERT_RENEW_BEFORE_DAYS:-30}
    restart: unless-stopped
    networks: [orch-net]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  orch-net:
    name: orch-net

volumes:
  orch-data:
